name: tests
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  go-test:
    name: Go tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        go: ['1.27']
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@master
    - name: Running go tests
      env:
        GO111MODULE: on
      run: go test ./... -timeout 180s -tags debug

  elk-vm-test:
    name: Elk VM tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        go: ['1.27']
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@master
    - name: Running Elk VM tests
      env:
        GO111MODULE: on
      run: ELKWARN=0 go run -tags debug ./cmd/elk test

  elk-native-test:
    name: Elk Native tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        go: ['1.27']
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@master
    - name: Running Elk Native tests
      env:
        GO111MODULE: on
      run: ELKWARN=0 go run -tags debug ./cmd/elk test --native
